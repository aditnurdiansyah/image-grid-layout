<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid Layout</title>

    <!-- SEO (Search Engine Optimization) -->
    <meta name="description"
      content="Personal portfolio of Adit Nurdiansyah, a Full Stack Developer.">
    <meta name="keywords"
      content="Web Development, Full Stack Developer, HTML, CSS, Personal Portfolio">
    <meta name="author" content="Adit Nurdiansyah">

    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon/favicon.ico" type="image/x-icon">

    <!-- OG (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aditnurdiansyah.my.id">
    <meta property="og:title" content="Adit Nurdiansyah - Full Stack Developer">
    <meta property="og:description"
      content="Single Page CV of Adit Nurdiansyah, a Full Stack Developer.">
    <meta property="og:image"
      content="https://aditnurdiansyah.my.id/assets/open-graph/aditnurdiansyah-full-stack-developer-og.jpg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Rosarivo:ital@0;1&display=swap"
      rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="image-grid">
      <img src="/assets/images/photo-1.avif" alt="Photo 1">
      <img src="/assets/images/photo-2.avif" alt="Photo 2">
      <img src="/assets/images/photo-3.avif" alt="Photo 3">
      <img src="/assets/images/photo-4.avif" alt="Photo 4">
      <img src="/assets/images/photo-5.avif" alt="Photo 5">
      <img src="/assets/images/photo-6.avif" alt="Photo 6">
    </main>
  </body>
</html>
